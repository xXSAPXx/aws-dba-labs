---
# Prometheus and Grafana in Docker (one Compose project), next to PMM on the PMM server.
# Prometheus scrapes itself and Grafana, and finds the lab's servers by their tags (EC2 service discovery,
# with the server's IAM role). The exporters, their scrape jobs, the dashboards and the alert rules come later.

prometheus_grafana_dir: /opt/prometheus-grafana # compose.yaml, prometheus.yml, Grafana's provisioning
prometheus_grafana_prometheus_image: prom/prometheus:v3.15.1
prometheus_grafana_grafana_image: grafana/grafana:13.2.4 # the open-source edition (grafana-oss has no 13.x tags)

# Ports on the server (the lab's security group opens them to your IP only).
prometheus_grafana_prometheus_port: 9090
prometheus_grafana_grafana_port: 3000

prometheus_grafana_scrape_interval: 15s
prometheus_grafana_retention: 1d # how long Prometheus keeps the samples

# EC2 service discovery: the region, and the value of the Lab tag that marks this lab's servers.
prometheus_grafana_ec2_region: us-east-1
prometheus_grafana_ec2_lab: "" # set by the lab, required

# Grafana's admin password: set by the lab (group_vars), required.
prometheus_grafana_admin_password: ""
