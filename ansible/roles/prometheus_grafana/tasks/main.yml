---
# Prometheus and Grafana as one Docker Compose project, next to the PMM container. Docker comes from the
# pmm_server role, which runs before this one. The configuration comes from the templates; the data lives in
# Docker volumes, so it survives a restart and a new image (and is gone with the lab).

- name: Check that the lab set the Lab tag and the Grafana admin password
  ansible.builtin.assert:
    that:
      - prometheus_grafana_ec2_lab | length > 0
      - prometheus_grafana_admin_password | length > 0
    fail_msg: Set prometheus_grafana_ec2_lab and prometheus_grafana_admin_password in the lab's group_vars.
    quiet: true

- name: Install the Docker Compose plugin
  ansible.builtin.dnf:
    name: docker-compose-plugin
    state: present

- name: Create the project directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ prometheus_grafana_dir }}"
    - "{{ prometheus_grafana_dir }}/grafana-provisioning/datasources"

# promtool, from the same image, checks the file before it replaces the running configuration.
- name: Write the Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_grafana_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      docker run --rm --network none --user root --volume %s:/tmp/prometheus.yml:ro
      --entrypoint promtool {{ prometheus_grafana_prometheus_image }} check config /tmp/prometheus.yml
  notify: Restart Prometheus

- name: Write Grafana's data source (Prometheus)
  ansible.builtin.template:
    src: grafana-datasources.yaml.j2
    dest: "{{ prometheus_grafana_dir }}/grafana-provisioning/datasources/prometheus.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Grafana

- name: Write Grafana's admin password
  ansible.builtin.template:
    src: grafana.env.j2
    dest: "{{ prometheus_grafana_dir }}/grafana.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write the Compose project
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ prometheus_grafana_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

# `docker compose up`: creates the containers, and recreates one whose image or settings changed.
- name: Start Prometheus and Grafana
  community.docker.docker_compose_v2:
    project_src: "{{ prometheus_grafana_dir }}"
    state: present

- name: Apply the configuration changes
  ansible.builtin.meta: flush_handlers

- name: Wait for Prometheus to be ready
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ prometheus_grafana_prometheus_port }}/-/ready
  register: prometheus_grafana_prometheus_ready
  until: prometheus_grafana_prometheus_ready.status == 200
  retries: 30
  delay: 2

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ prometheus_grafana_grafana_port }}/api/health
  register: prometheus_grafana_grafana_ready
  until: prometheus_grafana_grafana_ready.status == 200
  retries: 30
  delay: 2

# Grafana takes the password from grafana.env only when it creates its database, on the first start.
# Later (a new password in credentials/), it is set with Grafana's CLI; the password goes in on stdin.
- name: Check Grafana's admin login
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ prometheus_grafana_grafana_port }}/api/user
    user: admin
    password: "{{ prometheus_grafana_admin_password }}"
    force_basic_auth: true
    status_code: [200, 401]
  register: prometheus_grafana_admin_login
  no_log: true

- name: Set Grafana's admin password
  ansible.builtin.command:
    cmd: docker exec -i grafana grafana cli admin reset-admin-password --password-from-stdin
    stdin: "{{ prometheus_grafana_admin_password }}"
  when: prometheus_grafana_admin_login.status == 401
  changed_when: true
  no_log: true
