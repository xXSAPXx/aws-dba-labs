---
- name: Set the hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Add every lab server to /etc/hosts
  ansible.builtin.template:
    src: hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"

# sudo -i starts with sudo's secure_path, which has no /usr/local/bin on EL. Put it first, as in a
# normal login, so the lab's tools there (pg_activity, the pg_top wrapper, labapp) are found.
- name: Add /usr/local/bin to PATH in login shells that lack it
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (role: common). sudo -i starts without /usr/local/bin, where the lab's tools are.
      case ":$PATH:" in *:/usr/local/bin:*) ;; *) PATH="/usr/local/bin:$PATH" ;; esac
    dest: /etc/profile.d/usr-local-bin.sh
    owner: root
    group: root
    mode: "0644"

# Rocky Linux: the official server instead of the mirror list. The list hands out mirrors at random and does
# not check that they are current. One server got a BaseOS package list 11 days older than its AppStream
# list, and a package whose parts are split between the two (vim) could not be installed. The official
# server is always current and consistent. On other distributions no file matches and nothing changes.
- name: Find the Rocky Linux repository files
  ansible.builtin.find:
    paths: /etc/yum.repos.d
    patterns: "rocky*.repo"
  register: common_rocky_repo_files
  when: common_rocky_official_server | bool

- name: Switch the Rocky Linux repositories off the mirror list
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: "^mirrorlist="
    replace: "#mirrorlist="
  loop: "{{ common_rocky_repo_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Switch the Rocky Linux repositories to the official server
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^#baseurl=http://dl\.rockylinux\.org/'
    replace: "baseurl=https://dl.rockylinux.org/"
  loop: "{{ common_rocky_repo_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

# Before the first package install, which downloads every repository's metadata.
- name: Make dnf leave slow mirrors
  community.general.ini_file:
    path: /etc/dnf/dnf.conf
    section: main
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    owner: root
    group: root
    mode: "0644"
  loop: "{{ common_dnf_options | dict2items }}"

# The first downloads of a new server try again instead of failing. A new NAT gateway drops packets on and
# off for its first minutes, also after one connection got through: a server behind it reached the internet,
# and half a minute later this download timed out.
- name: Install the EPEL repository
  ansible.builtin.dnf:
    name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm
    state: present
    disable_gpg_check: true # bootstrap package: it installs the EPEL signing key itself
  register: common_epel_install
  until: common_epel_install is success
  retries: "{{ common_download_retries }}"
  delay: "{{ common_download_delay }}"

- name: Install admin tools
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present
  register: common_packages_install
  until: common_packages_install is success
  retries: "{{ common_download_retries }}"
  delay: "{{ common_download_delay }}"
