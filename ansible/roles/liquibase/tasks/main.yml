---
##################################################################
# Install Java, Liquibase and the JDBC drivers:
##################################################################

- name: Install Java
  ansible.builtin.dnf:
    name: "{{ liquibase_java_package }}"
    state: present

- name: Create the Liquibase directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: >-
    {{ [liquibase_dir ~ '/' ~ liquibase_version, liquibase_projects_dir, '/etc/liquibase']
       + (liquibase_projects | map(attribute='name') | map('regex_replace', '^', liquibase_projects_dir ~ '/') | list) }}

- name: Download Liquibase (checksum verified)
  ansible.builtin.get_url:
    url: "{{ liquibase_download_url }}"
    dest: "{{ liquibase_dir }}/liquibase-{{ liquibase_version }}.tar.gz"
    checksum: "{{ liquibase_checksum }}"
    mode: "0644"
  register: liquibase_download
  until: liquibase_download is success
  retries: 5
  delay: 10

- name: Unpack Liquibase
  ansible.builtin.unarchive:
    src: "{{ liquibase_dir }}/liquibase-{{ liquibase_version }}.tar.gz"
    dest: "{{ liquibase_dir }}/{{ liquibase_version }}"
    remote_src: true
    creates: "{{ liquibase_dir }}/{{ liquibase_version }}/liquibase"

- name: Download the JDBC drivers into Liquibase's lib (checksum verified)
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ liquibase_dir }}/{{ liquibase_version }}/lib/{{ item.file }}"
    checksum: "{{ item.checksum }}"
    mode: "0644"
  loop: "{{ liquibase_jdbc_drivers }}"
  loop_control:
    label: "{{ item.file }}"
  # Maven Central once answered "404 Not Found" for a driver for a moment: try again before giving up.
  register: liquibase_jdbc_download
  until: liquibase_jdbc_download is success
  retries: 5
  delay: 10

- name: Point the "current" link at Liquibase {{ liquibase_version }}
  ansible.builtin.file:
    src: "{{ liquibase_dir }}/{{ liquibase_version }}"
    dest: "{{ liquibase_dir }}/current"
    state: link

- name: Install the command that applies the pending changesets
  ansible.builtin.copy:
    src: update-when-ready.sh
    dest: "{{ liquibase_dir }}/update-when-ready.sh"
    owner: root
    group: root
    mode: "0755"


##################################################################
# Per database: changelog, settings, wrapper command:
##################################################################

- name: Set up each database's project
  ansible.builtin.include_tasks: project.yml
  loop: "{{ liquibase_projects }}"
  loop_control:
    loop_var: liquibase_project
    label: "{{ liquibase_project.name }}"


##################################################################
# Apply the pending changesets (liquibase update):
##################################################################

# The first run also generates the data (context "data"): minutes, so it runs in the background on the server.
# Mode "background" (see defaults): the update waits for its database by itself, and a later play collects it.
- name: Start the pending changesets in the background (liquibase update)
  ansible.builtin.command: >-
    {{ liquibase_dir }}/update-when-ready.sh {{ item.name }}
    {{ (liquibase_update_mode == 'background') | ternary(liquibase_database_wait, 0) }}
  async: 3600
  poll: 0
  loop: "{{ liquibase_projects }}"
  loop_control:
    label: "{{ item.name }}"
  register: liquibase_update_jobs
  changed_when: false # what it changed is reported when the result is collected

- name: Collect the updates
  ansible.builtin.include_tasks: finish.yml
  when: liquibase_update_mode != 'background'
