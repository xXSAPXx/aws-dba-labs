---
# PostgreSQL tools on the database servers.
# Live:
#   pg_activity (Dalibo): top-like overview of sessions, queries, waits and blocking; cancel / terminate.
#   pg_top: per-PID drill-down: current query (Q), EXPLAIN plan (E), locks (L), I/O.
# From the server log:
#   pgBadger: a report of slow statements, lock waits, errors, temporary files and checkpoints.

# pg_activity has no EL10 RPM outside the PGDG repository, so it's installed from PyPI into its own virtualenv.
postgresql_tools_pg_activity_venv: /opt/pg_activity
postgresql_tools_pg_activity_package: "pg_activity[psycopg]"

# Installed with dnf:
#   pg_top: from EPEL.
#   percona-pgbadger: from the Percona Distribution for PostgreSQL repository, which the lab's postgresql role
#     enables before this role runs. One of its Perl modules (perl-Text-CSV_XS) comes from EPEL.
postgresql_tools_packages:
  - pg_top
  - percona-pgbadger
