---
##################################################################
# The container (Docker is there already, for PMM):
##################################################################

- name: Write the pgwatch demo's logins
  ansible.builtin.copy:
    content: |
      PW_GRAFANANOANONYMOUS=1
      PW_GRAFANAPASSWORD={{ pgwatch_demo_grafana_password }}
      PW_WEBUSER={{ pgwatch_demo_web_user }}
      PW_WEBPASSWORD={{ pgwatch_demo_web_password }}
    dest: /etc/pgwatch-demo.env
    owner: root
    group: root
    mode: "0600"
  no_log: true # contains the passwords

- name: Check whether the pgwatch demo container exists
  ansible.builtin.command: docker inspect --type container {{ pgwatch_demo_container_name }}
  register: pgwatch_demo_container
  changed_when: false
  failed_when: false

# A changed setting only applies to a new container: docker rm -f pgwatch-demo, then run this again.
- name: Start the pgwatch demo container
  ansible.builtin.command: >-
    docker run --detach --restart unless-stopped
    --publish 127.0.0.1:{{ pgwatch_demo_grafana_port }}:3000
    --publish 127.0.0.1:{{ pgwatch_demo_web_port }}:8080
    --env-file /etc/pgwatch-demo.env
    {% for source in pgwatch_demo_sources | unique(attribute='host') %}
    --add-host {{ source.host }}:{{ source.address }}
    {% endfor %}
    --name {{ pgwatch_demo_container_name }}
    {{ pgwatch_demo_image }}
  when: pgwatch_demo_container.rc != 0
  changed_when: true

- name: Wait for pgwatch's web UI
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ pgwatch_demo_web_port }}/
  register: pgwatch_demo_web
  until: pgwatch_demo_web.status == 200
  retries: 60
  delay: 5

- name: Wait for pgwatch's Grafana
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ pgwatch_demo_grafana_port }}/api/health
  register: pgwatch_demo_grafana
  until: pgwatch_demo_grafana.status == 200
  retries: 60
  delay: 5


##################################################################
# The databases to monitor (pgwatch's REST API):
##################################################################

- name: Log in to pgwatch's REST API
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ pgwatch_demo_web_port }}/login
    method: POST
    body_format: json
    body: { user: "{{ pgwatch_demo_web_user }}", password: "{{ pgwatch_demo_web_password }}" }
    return_content: true
  register: pgwatch_demo_login
  no_log: true

- name: List the databases pgwatch monitors
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ pgwatch_demo_web_port }}/source
    headers:
      Token: "{{ pgwatch_demo_login.content | trim | regex_replace('^\"|\"$', '') }}"
    return_content: true
  register: pgwatch_demo_existing
  no_log: true

- name: Add the databases to monitor
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ pgwatch_demo_web_port }}/source
    method: POST
    headers:
      Token: "{{ pgwatch_demo_login.content | trim | regex_replace('^\"|\"$', '') }}"
    body_format: json
    body:
      Name: "{{ item.name }}"
      Kind: postgres
      Group: default
      ConnStr: postgresql://{{ item.user }}:{{ item.password }}@{{ item.host }}:5432/{{ item.dbname }}
      PresetMetrics: "{{ item.preset | default('exhaustive') }}"
      IsEnabled: true
    status_code: [200, 201]
  loop: "{{ pgwatch_demo_sources }}"
  loop_control:
    label: "{{ item.name }}"
  # pgwatch sends the list as text/plain, so Ansible does not parse it by itself.
  when: item.name not in (pgwatch_demo_existing.content | from_json | map(attribute='Name') | list)
  changed_when: true
  no_log: true # the connection string contains the password
