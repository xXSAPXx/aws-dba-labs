---
# PMM server to register with: the first host of the pmm_server group, over the VPC.
pmm_client_server_address: "{{ hostvars[groups['pmm_server'][0]]['private_ip'] }}"
pmm_client_server_url: "https://admin:{{ pmm_admin_password }}@{{ pmm_client_server_address }}:443"

# Services to monitor on this host, set by the lab (group_vars). Example:
#   - type: postgresql
#     name: pg1
#     username: pmm
#     password: "..."
#     extra_args: --query-source=pgstatmonitor
pmm_client_services: []

# Lock blocking metrics for PostgreSQL services (templates/lock-blocking.yml.j2): which session is at the
# root of lock waits, with its statement, and how many sessions wait behind it. Only blockers whose
# transaction has been open for at least this many seconds are reported.
pmm_client_lock_blocking_enabled: true
pmm_client_lock_blocking_min_seconds: 1

# Where the PMM client looks for custom queries: <dir>/<service type>/<resolution>-resolution/*.yml
pmm_client_custom_queries_dir: /usr/local/percona/pmm/collectors/custom-queries

# Custom query files installed as they are, set by the lab (group_vars), e.g. a company's own queries. Each goes to
# <pmm_client_custom_queries_dir>/<type>/<resolution>-resolution/<name>. Example:
#   - { src: "{{ playbook_dir }}/pmm-custom-queries/source/queries-mysqld.yml", type: mysql, resolution: medium, name: queries-mysqld.yml }
pmm_client_custom_query_files: []
