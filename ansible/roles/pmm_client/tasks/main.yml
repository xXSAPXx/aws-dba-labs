---
- name: Enable the PMM 3 client repository
  ansible.builtin.command: percona-release enable pmm3-client release
  changed_when: false # enabling an already enabled repository is a no-op

- name: Install the PMM client
  ansible.builtin.dnf:
    name: pmm-client
    state: present

- name: Check whether this node is registered with the PMM server
  ansible.builtin.command: pmm-admin status
  register: pmm_client_status
  changed_when: false
  failed_when: false

# --force replaces a stale registration of the same node name on the server.
- name: Register this node with the PMM server
  ansible.builtin.command: >-
    pmm-admin config --server-insecure-tls --force
    --server-url={{ pmm_client_server_url | quote }}
  when: pmm_client_status.rc != 0
  changed_when: true
  no_log: true

- name: List the services this node already monitors
  ansible.builtin.command: pmm-admin list
  register: pmm_client_list
  changed_when: false

# A service is listed as: <type>  <name>  <address:port>  <service id>
- name: Add the services to PMM
  ansible.builtin.command: >-
    pmm-admin add {{ item.type }}
    --username={{ item.username | quote }}
    --password={{ item.password | quote }}
    --service-name={{ item.name | quote }}
    {{ item.extra_args | default('') }}
  loop: "{{ pmm_client_services }}"
  when: >-
    pmm_client_list.stdout is not search('(?m)^\\S+\\s+' ~ (item.name | regex_escape) ~ '\\s+\\S+:\\d+')
  changed_when: true
  no_log: true

# PMM's exporter runs every file in this folder every 5 s (PMM's high resolution): once per server, as the
# queries are marked "master: true". It picks up a new or changed file without a restart.
- name: Install the lock blocking metrics for PostgreSQL
  ansible.builtin.template:
    src: lock-blocking.yml.j2
    dest: "{{ pmm_client_custom_queries_dir }}/postgresql/high-resolution/lab-lock-blocking.yml"
    owner: pmm-agent
    group: pmm-agent
    mode: "0640"
  when:
    - pmm_client_lock_blocking_enabled | bool
    - pmm_client_services | selectattr('type', 'equalto', 'postgresql') | list | length > 0

- name: Remove the lock blocking metrics for PostgreSQL when they are switched off
  ansible.builtin.file:
    path: "{{ pmm_client_custom_queries_dir }}/postgresql/high-resolution/lab-lock-blocking.yml"
    state: absent
  when: not (pmm_client_lock_blocking_enabled | bool)

# The lab's own custom query files, as they are (pmm_client_custom_query_files).
- name: Install the lab's custom query files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ pmm_client_custom_queries_dir }}/{{ item.type }}/{{ item.resolution }}-resolution/{{ item.name }}"
    owner: pmm-agent
    group: pmm-agent
    mode: "0640"
  loop: "{{ pmm_client_custom_query_files }}"
  loop_control:
    label: "{{ item.type }}/{{ item.resolution }}-resolution/{{ item.name }}"
