---
# labapp: the lab's simulated application (tools/labapp). Runs on the PMM server.
labapp_dir: /opt/labapp
labapp_user: labapp
labapp_source_dir: "{{ role_path }}/../../../tools/labapp"
labapp_files: [labapp.py, common.py, workload.py, scenarios.py]
labapp_python_packages:
  - psycopg[binary]>=3.2
  - prometheus_client>=0.20

##################################################################
# Probe: availability and latency (labapp-probe)
##################################################################

# Seconds: write check, connect check, timeout for connecting / each statement.
labapp_probe_interval: 0.25
labapp_probe_connect_interval: 1.0
labapp_probe_timeout: 2.0

# Databases to probe, set by the lab (group_vars). Example:
#   - name: postgresql-source
#     dsn: "host=postgresql-source dbname=labapp user=labapp password=..."
labapp_targets: []

# The probe listens on this port; PMM (in its container) collects it over the host's private IP.
labapp_metrics_port: 9300
labapp_metrics_host: "{{ private_ip }}"

##################################################################
# Workload: the shop's traffic (labapp-workload)
##################################################################

labapp_workload_enabled: true
labapp_workload_rate: 100 # base requests per second (live: labapp load rate N)
# Percent of checkouts done in the database by shop.place_order() (tx checkout_db) instead of in the
# application (tx checkout), to compare the two side by side (live: labapp load checkout-in-db N).
labapp_workload_checkout_in_database: 50
labapp_workload_workers: 24 # connections as shop_app
labapp_workload_metrics_port: 9302
labapp_workload_control_port: 9301 # 127.0.0.1 only, used by `labapp load`

# One connection string per role, set by the lab (group_vars): app, reporting, analytics, batch.
# The scenarios also need: support, migrator, cdc.
labapp_workload_dsn: {}

# Transaction mix (weights); empty = the defaults in tools/labapp/workload.py.
labapp_workload_mix: {}

# Cycles sized for a 1-2 hour lab session (seconds).
labapp_workload_wave: { period: 3600, amplitude: 0.4 } # a "day" every hour: +-40% around the base rate
labapp_workload_flash_sale: { every: 1800, first: 1200, duration: 180, multiplier: 3, hot_products: 20 }
labapp_workload_jobs:
  sales_dashboard: { every: 120, first: 60, target: 30 } # ~30 s, shop_reporting
  lifetime_value_export: { every: 300, first: 150, target: 60 } # ~1 min slow cursor, shop_analytics
  bi_extract: { every: 900, first: 420, target: 300 } # ~5 min REPEATABLE READ, shop_analytics
  cart_cleanup: { every: 600, first: 300, batch_size: 5000 } # CALL shop.cleanup_carts(): a commit per batch, shop_batch
  restock: { every: 900, first: 450 } # shop_batch
  stock_recount: { every: 1200, first: 600, target: 90, mode: single_transaction } # or: batched

# Scenarios: incidents on demand (labapp scenario run NAME). Each ends by itself after `seconds`.
labapp_workload_scenarios:
  forgotten_transaction: { seconds: 600, customers: 50000 } # rows of the most active customers it locks
  migration_behind_report: { seconds: 300 }
  revoked_privilege: { seconds: 600 }
  abandoned_slot: { seconds: 1800 } # WAL builds up slowly: give it time to show
  # Drops the table in the first 4 of its 10 minutes. While a report holds the table it tries again every
  # retry_seconds: the 6 minutes left are more than the longest report (bi_extract, 5 minutes).
  dropped_table: { seconds: 600, retry_seconds: 20 }

##################################################################
# PMM server on this host
##################################################################

# API for the metrics registration, Grafana for annotations and the dashboards.
labapp_pmm_url: https://127.0.0.1
labapp_pmm_container: pmm-server
labapp_pmm_user: admin
labapp_pmm_password: "" # set by the lab, required
labapp_dashboard_folder_uid: lab
labapp_dashboard_folder_title: Lab
