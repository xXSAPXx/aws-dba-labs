---
# The metrics endpoints, which the lab's Prometheus scrapes (prometheus_grafana_static_jobs).
labapp_exporters: >-
  {{ [{'name': 'labapp-probe', 'port': labapp_metrics_port}]
     + ([{'name': 'labapp-workload', 'port': labapp_workload_metrics_port}] if labapp_workload_enabled else []) }}
# The dashboards uploaded to the "Lab" folder in PMM. `file` is relative to ansible/roles.
#   PostgreSQL lock blocking: the metrics of the PMM client's lock blocking queries (role pmm_client), which only
#   PMM has. Lab: Application is in the lab's Grafana instead (prometheus_grafana_dashboards).
labapp_dashboards:
  - file: pmm_client/files/postgresql-lock-blocking-dashboard.json
    uid: postgresql-lock-blocking
