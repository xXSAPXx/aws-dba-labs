---
##################################################################
# Docker:
##################################################################

- name: Add the Docker CE repository
  ansible.builtin.get_url:
    url: "{{ pmm_server_docker_repo }}"
    dest: /etc/yum.repos.d/docker-ce.repo
    owner: root
    group: root
    mode: "0644"

- name: Install Docker
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present

# Docker turns this on itself in iptables mode, but not in nftables mode.
- name: Enable IP forwarding (container networking)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/90-docker.conf
    state: present
    reload: true

- name: Configure Docker
  ansible.builtin.copy:
    content: "{{ pmm_server_docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Apply a changed Docker configuration before starting containers
  ansible.builtin.meta: flush_handlers


##################################################################
# PMM Server container:
##################################################################

- name: Check whether the PMM server container exists
  ansible.builtin.command: docker inspect --type container {{ pmm_server_container_name }}
  register: pmm_server_container
  changed_when: false
  failed_when: false

- name: Start the PMM server container
  ansible.builtin.command: >-
    docker run --detach --restart always
    --publish 443:8443
    --volume {{ pmm_server_volume }}:/srv
    --name {{ pmm_server_container_name }}
    {{ pmm_server_image }}
  when: pmm_server_container.rc != 0
  changed_when: true

- name: Wait for PMM to be ready
  ansible.builtin.uri:
    url: https://127.0.0.1/v1/server/readyz
    validate_certs: false
  register: pmm_server_ready
  until: pmm_server_ready.status == 200
  retries: 60
  delay: 5


##################################################################
# Admin password (replaces the default admin / admin):
##################################################################

- name: Check whether the admin password is already set
  ansible.builtin.uri:
    url: https://127.0.0.1/graph/api/user
    user: admin
    password: "{{ pmm_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 401]
  register: pmm_server_login
  no_log: true

- name: Set the admin password
  ansible.builtin.command: docker exec {{ pmm_server_container_name }} change-admin-password {{ pmm_admin_password }}
  when: pmm_server_login.status == 401
  changed_when: true
  no_log: true


##################################################################
# The lab's dashboards (pmm_server_dashboards):
##################################################################

- name: Upload the lab's dashboards to PMM
  when: pmm_server_dashboards | length > 0
  module_defaults:
    ansible.builtin.uri:
      user: admin
      password: "{{ pmm_admin_password }}"
      force_basic_auth: true
      validate_certs: false
  block:
    - name: Read PMM's data sources
      ansible.builtin.uri:
        url: https://127.0.0.1/graph/api/datasources
      register: pmm_server_datasources

    - name: Create the dashboards' folder
      ansible.builtin.uri:
        url: https://127.0.0.1/graph/api/folders
        method: POST
        body_format: json
        body:
          uid: "{{ pmm_server_dashboard_folder_uid }}"
          title: "{{ pmm_server_dashboard_folder_title }}"
        status_code: [200, 409, 412] # 409 and 412: it exists
      register: pmm_server_folder
      changed_when: pmm_server_folder.status == 200

    - name: Read the dashboards' copies in PMM
      ansible.builtin.uri:
        url: "https://127.0.0.1/graph/api/dashboards/uid/{{ (lookup('ansible.builtin.file', item.src) | from_json).uid }}"
        status_code: [200, 404]
      register: pmm_server_current_dashboards
      loop: "{{ pmm_server_dashboards }}"
      loop_control:
        label: "{{ item.src | basename }}"

    # The file as it is, with this PMM's data source uids: by type, the default data source sorted last so it wins.
    # id and version are Grafana's own (the id the export had is another Grafana's), so they are left out of the comparison.
    - name: Upload the dashboards that differ from their files
      ansible.builtin.uri:
        url: https://127.0.0.1/graph/api/dashboards/db
        method: POST
        body_format: json
        body:
          dashboard: "{{ pmm_server_dashboard }}"
          folderUid: "{{ pmm_server_dashboard_folder_uid }}"
          overwrite: true
          message: Uploaded by Ansible
      vars:
        pmm_server_datasource_uids: >-
          {{ pmm_server_datasources.json | sort(attribute='isDefault') | items2dict(key_name='type', value_name='uid') }}
        pmm_server_dashboard_text: >-
          {%- set ns = namespace(text=lookup('ansible.builtin.file', item.item.src)) -%}
          {%- for uid, type in (item.item.datasources | default({})).items() -%}
          {%- set ns.text = ns.text | replace('"' ~ uid ~ '"', '"' ~ pmm_server_datasource_uids[type] ~ '"') -%}
          {%- endfor -%}
          {{ ns.text }}
        pmm_server_dashboard: "{{ pmm_server_dashboard_text | from_json | combine({'id': none}) }}"
      loop: "{{ pmm_server_current_dashboards.results }}"
      loop_control:
        label: "{{ item.item.src | basename }}"
      when: >-
        item.status == 404
        or item.json.dashboard | combine({'id': none, 'version': none}) != pmm_server_dashboard | combine({'id': none, 'version': none})
      changed_when: true
