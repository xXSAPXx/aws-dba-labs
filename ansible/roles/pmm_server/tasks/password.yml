---
# The PMM admin password's file, on the Ansible machine: run by each lab's first play, before anything reads it.
# PMM's Grafana refuses an admin password without upper and lower case, a digit and a symbol (password_policy, in the
# image since November 2026). The lab's password lookup (group_vars, letters and digits) makes one without a symbol,
# so the file is written here: on the first run, and again when an older lab's password has no symbol. The new one
# takes over on that run (PMM, the PMM client and the PostgreSQL lab's labapp all read it from group_vars).
# "_" is the symbol: the password also goes into the PMM client's URL (https://admin:<password>@...).

- name: Read the PMM admin password's file, if there is one
  ansible.builtin.set_fact:
    pmm_server_password_now: "{{ lookup('ansible.builtin.file', pmm_server_password_file, errors='ignore') | default('', true) }}"
  no_log: true

- name: Write a new PMM admin password that meets the policy
  ansible.builtin.copy:
    dest: "{{ pmm_server_password_file }}"
    content: |
      {{ lookup('community.general.random_string', length=24, min_lower=1, min_upper=1, min_numeric=1, min_special=1,
                override_special='_') }}
    mode: "0600"
  when: pmm_server_password_now is not regex('^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{12,}$')
  no_log: true
