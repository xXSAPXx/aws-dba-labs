---
pmm_server_image: percona/pmm-server:3
pmm_server_container_name: pmm-server
pmm_server_volume: pmm-data

# Docker CE repository: Docker publishes one for RHEL and one for CentOS-compatible systems (Rocky, Alma).
pmm_server_docker_repo: "https://download.docker.com/linux/{{ 'rhel' if ansible_facts['distribution'] == 'RedHat' else 'centos' }}/docker-ce.repo"

# Docker daemon settings (/etc/docker/daemon.json). EL10 is nftables-based: Docker's default iptables mode
# needs kernel modules (xt_addrtype) that the Rocky Linux 10 image doesn't ship, so use nftables there.
pmm_server_docker_daemon_config: "{{ {'firewall-backend': 'nftables'} if ansible_facts['distribution_major_version'] | int >= 10 else {} }}"

# pmm_admin_password: set by the lab (group_vars), required.

# Dashboards for PMM's Grafana, set by the lab (group_vars), e.g. a company's own. Every run uploads each file whose copy in
# PMM differs, so a re-run replaces changes made in PMM. datasources: the uids of the data sources the file was exported
# with, each replaced at the upload with this PMM's data source of that type (the default one if there are more). Example:
#   - src: "{{ playbook_dir }}/pmm-dashboards/slow_queries_real_time.json"
#     datasources: { FugqTr57z: prometheus, PDEE91DDB90597936: grafana-clickhouse-datasource }
pmm_server_dashboards: []
pmm_server_dashboard_folder_uid: lab
pmm_server_dashboard_folder_title: Lab
