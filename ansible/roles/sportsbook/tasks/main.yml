---
- name: Check that the lab set the connections, the probe's servers and the Grafana password
  ansible.builtin.assert:
    that:
      - sportsbook_db.app is defined and sportsbook_db.feed is defined
      - sportsbook_db.batch is defined and sportsbook_db.reporting is defined
      - sportsbook_probe_targets | length > 0
      - sportsbook_grafana_password | length > 0
    fail_msg: sportsbook_db (app, feed, batch, reporting), sportsbook_probe_targets and sportsbook_grafana_password must be set (group_vars).
    quiet: true


##################################################################
# Install the application:
##################################################################

- name: Create the sportsbook system user
  ansible.builtin.user:
    name: "{{ sportsbook_user }}"
    system: true
    shell: /sbin/nologin
    home: "{{ sportsbook_dir }}"
    create_home: false

- name: Create the sportsbook directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ sportsbook_dir }}", group: root, mode: "0755" }
    - { path: /etc/sportsbook, group: "{{ sportsbook_user }}", mode: "0750" }

- name: Install the Python libraries in a virtualenv
  ansible.builtin.pip:
    name: "{{ sportsbook_python_packages }}"
    virtualenv: "{{ sportsbook_dir }}/venv"
    virtualenv_command: python3 -m venv
    state: present
  notify:
    - Restart the sportsbook workload
    - Restart the sportsbook probe

- name: Install the application
  ansible.builtin.copy:
    src: "{{ sportsbook_source_dir }}/{{ item }}"
    dest: "{{ sportsbook_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: "{{ sportsbook_files }}"
  notify:
    - Restart the sportsbook workload
    - Restart the sportsbook probe

- name: Put the sportsbook command on PATH
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Managed by Ansible (role: sportsbook).
      exec {{ sportsbook_dir }}/venv/bin/python {{ sportsbook_dir }}/sportsbook.py "$@"
    dest: /usr/local/bin/sportsbook
    owner: root
    group: root
    mode: "0755"


##################################################################
# The probe (sportsbook-probe): first, so it measures from the start
##################################################################

- name: Write the probe configuration
  ansible.builtin.template:
    src: probe.json.j2
    dest: /etc/sportsbook/probe.json
    owner: root
    group: "{{ sportsbook_user }}"
    mode: "0640"
  notify: Restart the sportsbook probe
  no_log: true # contains passwords

- name: Install the probe service
  ansible.builtin.template:
    src: sportsbook-probe.service.j2
    dest: /etc/systemd/system/sportsbook-probe.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the sportsbook probe

- name: Start the probe
  ansible.builtin.systemd_service:
    name: sportsbook-probe
    state: started
    enabled: true
    daemon_reload: true


##################################################################
# The workload service (sportsbook-workload):
##################################################################

- name: Write the workload configuration
  ansible.builtin.template:
    src: workload.json.j2
    dest: /etc/sportsbook/workload.json
    owner: root
    group: "{{ sportsbook_user }}"
    mode: "0640"
  notify: Restart the sportsbook workload
  no_log: true # contains passwords

- name: Install the workload service
  ansible.builtin.template:
    src: sportsbook-workload.service.j2
    dest: /etc/systemd/system/sportsbook-workload.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart the sportsbook workload

- name: Start the workload
  ansible.builtin.systemd_service:
    name: sportsbook-workload
    state: started
    enabled: true
    daemon_reload: true

- name: Apply the changes
  ansible.builtin.meta: flush_handlers

# Prometheus scrapes both (the lab's prometheus_grafana_static_jobs).
- name: Wait for the metrics of the workload and the probe
  ansible.builtin.uri:
    url: http://127.0.0.1:{{ item }}/metrics
  register: sportsbook_metrics
  until: sportsbook_metrics.status == 200
  retries: 30
  delay: 2
  loop:
    - "{{ sportsbook_metrics_port }}"
    - "{{ sportsbook_probe_metrics_port }}"
