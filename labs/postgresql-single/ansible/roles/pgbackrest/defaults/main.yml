---
# The stanza: one per cluster, also its folder in the bucket (/pgbackrest/<stanza>). The lab sets it in group_vars/postgresql.yml.
pgbackrest_stanza: postgresql-single
pgbackrest_pg_path: /var/lib/pgsql/17/data # the postgresql role's data directory

# The lab's bucket and its region: Terraform writes them into the inventory.
pgbackrest_s3_bucket: "{{ backup_bucket }}"
pgbackrest_s3_region: "{{ backup_bucket_region }}"

# The repository is encrypted (repo1-cipher-type, repo1-cipher-pass). Its passphrase is in a Secrets Manager secret, which the
# server reads with its IAM role: pgbackrest_cipher_secret, from the inventory (Terraform). A repository's passphrase can't be
# changed: a new passphrase needs a new repository.

# Parallel processes for compression and transfer: the server's vCPUs.
pgbackrest_process_max: "{{ ansible_facts['processor_vcpus'] }}"
