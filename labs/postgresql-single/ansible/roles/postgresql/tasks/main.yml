---
##################################################################
# Percona Distribution for PostgreSQL installation:
##################################################################

- name: Disable the distribution's PostgreSQL module (Percona packages are used instead)
  ansible.builtin.command: dnf -y module disable postgresql
  changed_when: false
  when: ansible_facts['distribution_major_version'] | int < 10 # EL10 has no dnf modules

- name: Enable the Percona Distribution for PostgreSQL repository
  ansible.builtin.command: percona-release setup ppg{{ postgresql_version }}
  args:
    creates: "{{ postgresql_bin_dir }}/postgres"

- name: Install PostgreSQL, pgBackRest, pg_repack, pg_stat_monitor and pgAudit
  ansible.builtin.dnf:
    name: "{{ postgresql_packages }}"
    state: present

- name: Initialize the database cluster (with data checksums)
  ansible.builtin.command: "{{ postgresql_bin_dir }}/postgresql-{{ postgresql_version }}-setup initdb"
  args:
    creates: "{{ postgresql_data_dir }}/PG_VERSION"
  environment:
    PGSETUP_INITDB_OPTIONS: "{{ postgresql_initdb_options }}"


##################################################################
# Configuration:
##################################################################

- name: Include conf.d from postgresql.conf
  ansible.builtin.lineinfile:
    path: "{{ postgresql_data_dir }}/postgresql.conf"
    regexp: "^#?include_dir ="
    line: "include_dir = 'conf.d'"
  notify: Restart PostgreSQL

- name: Create conf.d
  ansible.builtin.file:
    path: "{{ postgresql_data_dir }}/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Write the lab settings
  ansible.builtin.template:
    src: 01-lab.conf.j2
    dest: "{{ postgresql_data_dir }}/conf.d/01-lab.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart PostgreSQL

- name: Write pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ postgresql_data_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload PostgreSQL

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

- name: Apply pending restarts before configuring the database
  ansible.builtin.meta: flush_handlers


##################################################################
# Database objects:
##################################################################

- name: Create the pg_stat_monitor extension
  community.postgresql.postgresql_ext:
    name: pg_stat_monitor
    login_db: postgres
  become: true
  become_user: postgres

# pgAudit logs through the server (shared_preload_libraries) in every database. Its extension is per database:
# it adds the event triggers that give each DDL audit line the type and name of the object changed. Without
# it, DDL in that database is still logged, but without them. template1: databases created later inherit it.
# pgAudit refuses to create its extension while pgaudit.log is set, so these sessions start with it off.
- name: Create the pgaudit extension in postgres and template1
  community.postgresql.postgresql_ext:
    name: pgaudit
    schema: public
    login_db: "{{ item }}"
  loop: [postgres, template1]
  environment:
    PGOPTIONS: "-c pgaudit.log=none"
  become: true
  become_user: postgres

- name: Create the PMM monitoring user (no superuser)
  community.postgresql.postgresql_user:
    name: "{{ postgresql_monitoring_user }}"
    password: "{{ postgresql_monitoring_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER
    login_db: postgres
  become: true
  become_user: postgres
  no_log: true

- name: Let the PMM user read all statistics (pg_monitor)
  community.postgresql.postgresql_membership:
    memberships:
      - groups: [pg_monitor]
        target_roles: ["{{ postgresql_monitoring_user }}"]
    granted_by_any: true
    login_db: postgres
  become: true
  become_user: postgres

- name: Create the application and admin users (with their per-role settings)
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ item.password | default(omit) }}"
    role_attr_flags: "{{ item.role_attr_flags | default('LOGIN') }}"
    conn_limit: "{{ item.conn_limit | default(omit) }}"
    configuration: "{{ item.configuration | default(omit) }}"
    login_db: postgres
  loop: "{{ postgresql_app_users }}"
  become: true
  become_user: postgres
  no_log: true

- name: Grant role memberships
  community.postgresql.postgresql_membership:
    memberships: "{{ postgresql_memberships }}"
    granted_by_any: true
    login_db: postgres
  become: true
  become_user: postgres
  when: postgresql_memberships | length > 0

- name: Create the application databases
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
  loop: "{{ postgresql_app_databases }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: postgres

# For databases that existed before the extension was added to template1.
- name: Create the pgaudit extension in the application databases
  community.postgresql.postgresql_ext:
    name: pgaudit
    schema: public
    login_db: "{{ item.name }}"
  loop: "{{ postgresql_app_databases }}"
  loop_control:
    label: "{{ item.name }}"
  environment:
    PGOPTIONS: "-c pgaudit.log=none"
  become: true
  become_user: postgres


##################################################################
# OS:
##################################################################

- name: Let the postgres OS user use sudo (lab convenience)
  ansible.builtin.copy:
    content: "postgres ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/postgres
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  when: postgresql_os_user_sudo
