---
# Lab passwords: generated on the first run and kept in ./credentials/ (git-ignored).
# PMM UI login: admin / $(cat credentials/pmm_admin_password)
pmm_admin_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/pmm_admin_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_monitoring_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_pmm_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_bench_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_bench_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_labapp_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_labapp_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_dba_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_dba_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_shop_migrator_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_shop_migrator_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_shop_app_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_shop_app_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_shop_reporting_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_shop_reporting_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_shop_analytics_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_shop_analytics_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_shop_batch_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_shop_batch_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_debezium_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_debezium_password', length=24, chars=['ascii_letters', 'digits']) }}"
postgresql_shop_support_password: "{{ lookup('ansible.builtin.password', playbook_dir ~ '/credentials/postgresql_shop_support_password', length=24, chars=['ascii_letters', 'digits']) }}"

# Size of the generated shop data (schema/shop): 1 = about 1.5-2 GB. Used only when the data is first generated.
shop_scale: 1
