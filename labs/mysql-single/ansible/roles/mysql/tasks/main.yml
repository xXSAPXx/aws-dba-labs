---
##################################################################
# Percona Server for MySQL installation:
##################################################################

- name: Enable the Percona Server for MySQL repository
  ansible.builtin.command: percona-release setup -y {{ mysql_repository }}
  args:
    creates: /usr/sbin/mysqld

- name: Enable the XtraBackup and Percona Toolkit repositories
  ansible.builtin.command: percona-release enable {{ item }} release
  loop: "{{ mysql_extra_repositories }}"
  changed_when: false # enabling an already enabled repository is a no-op

# PERCONA_TELEMETRY_DISABLE: Percona's packages would otherwise install and start a telemetry agent.
- name: Install Percona Server, XtraBackup, MySQL Shell, Percona Toolkit and the AWS CLI
  ansible.builtin.dnf:
    name: "{{ mysql_packages }}"
    state: present
  environment:
    PERCONA_TELEMETRY_DISABLE: "1"


##################################################################
# Configuration and first start:
##################################################################

- name: Read the files in /etc/my.cnf.d
  ansible.builtin.lineinfile:
    path: /etc/my.cnf
    line: "!includedir /etc/my.cnf.d"
    insertafter: EOF
  notify: Restart MySQL

# Before MySQL starts with lab.cnf: without its folder the audit log component stays off. SELinux (enforcing on
# Rocky Linux) lets MySQL write only to its own log type.
- name: Create the audit log folder
  ansible.builtin.file:
    path: "{{ mysql_audit_log_dir }}"
    state: directory
    owner: mysql
    group: mysql
    mode: "0750"
    setype: mysqld_log_t

- name: Write the lab settings
  ansible.builtin.template:
    src: lab.cnf.j2
    dest: /etc/my.cnf.d/lab.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Restart MySQL

# The first start creates the data directory on the data volume (mysqld --initialize) and writes a
# temporary root password to the error log.
- name: Start MySQL
  ansible.builtin.systemd_service:
    name: "{{ mysql_service }}"
    state: started
    enabled: true

- name: Apply pending restarts before configuring the database
  ansible.builtin.meta: flush_handlers


##################################################################
# root: the lab password instead of the temporary one
##################################################################

- name: Check whether root already has the lab password
  ansible.mysql.mysql_info:
    filter: version
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: "{{ mysql_socket }}"
  register: mysql_root_login
  failed_when: false
  no_log: true

- name: Set the root password (first run only)
  when: mysql_root_login.version is not defined
  block:
    - name: Read the temporary root password from the error log
      ansible.builtin.shell: |
        set -o pipefail
        grep 'temporary password' {{ mysql_error_log }} | tail -n 1 | awk '{print $NF}'
      args:
        executable: /bin/bash
      register: mysql_temporary_password
      changed_when: false
      failed_when: mysql_temporary_password.stdout | length == 0
      no_log: true

    # The password goes in on stdin, so it never shows in the process list.
    - name: Replace the temporary root password with the lab password
      ansible.builtin.command:
        cmd: mysql --connect-expired-password -u root -S {{ mysql_socket }}
        stdin: "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}';"
      environment:
        MYSQL_PWD: "{{ mysql_temporary_password.stdout }}"
      changed_when: true
      no_log: true

- name: Store root's login (/root/.my.cnf), so sudo mysql needs no password
  ansible.builtin.template:
    src: root-my.cnf.j2
    dest: /root/.my.cnf
    owner: root
    group: root
    mode: "0600"
  no_log: true


##################################################################
# Audit log: who ran which DDL / DCL, when and from where (no DML)
# Before the databases and users, so their creation is in the log too.
##################################################################

- name: Check whether the audit log component is installed
  ansible.mysql.mysql_query:
    query: SELECT COUNT(*) AS installed FROM mysql.component WHERE component_urn = 'file://component_audit_log_filter'
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: "{{ mysql_socket }}"
  register: mysql_audit_component
  changed_when: false

# Percona's script creates the audit tables in the mysql schema, then installs the component. The restart starts
# the component with its settings from lab.cnf (the log file is read only at startup).
- name: Install the audit log component
  ansible.builtin.shell: |
    set -eo pipefail
    script=$(rpm -ql percona-server-server | grep '/audit_log_filter_linux_install.sql$')
    mysql --defaults-file=/root/.my.cnf -D mysql < "$script"
  args:
    executable: /bin/bash
  when: mysql_audit_component.query_result[0][0].installed == 0
  changed_when: true
  notify: Restart MySQL

- name: Restart MySQL with the audit log component
  ansible.builtin.meta: flush_handlers

# The filter goes in as an SQL string, built inside the query: a template that is only JSON would come back as
# a dictionary. The filter has no quotes in it.
- name: Set the audit filter for every account
  vars:
    mysql_audit_filter_sql: "'{{ lookup('ansible.builtin.file', 'audit_log_filter_' ~ mysql_audit_log_filter ~ '.json') | from_json | to_json }}'"
  block:
    - name: Check the audit filter and its assignment to every account ('%')
      ansible.mysql.mysql_query:
        query: >-
          SELECT
          (SELECT COUNT(*) FROM mysql.audit_log_filter
           WHERE name = '{{ mysql_audit_log_filter }}' AND filter = CAST({{ mysql_audit_filter_sql }} AS JSON)) AS filter_set,
          (SELECT COUNT(*) FROM mysql.audit_log_user
           WHERE username = '%' AND filtername = '{{ mysql_audit_log_filter }}') AS assigned
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket }}"
      register: mysql_audit_filter
      changed_when: false

    # As in the MySQL notes: remove, set, assign to every account, flush. Only when something differs: every set
    # stores a new revision, and the flush detaches open sessions until they reconnect.
    - name: Set the audit filter and assign it to every account
      ansible.mysql.mysql_query:
        query:
          - SELECT audit_log_filter_remove_filter('{{ mysql_audit_log_filter }}') AS result
          - SELECT audit_log_filter_set_filter('{{ mysql_audit_log_filter }}', {{ mysql_audit_filter_sql }}) AS result
          - SELECT audit_log_filter_set_user('%', '{{ mysql_audit_log_filter }}') AS result
          - SELECT audit_log_filter_flush() AS result
        login_user: root
        login_password: "{{ mysql_root_password }}"
        login_unix_socket: "{{ mysql_socket }}"
      when: mysql_audit_filter.query_result[0][0].filter_set == 0 or mysql_audit_filter.query_result[0][0].assigned == 0
      register: mysql_audit_filter_set
      changed_when: true
      # Each function answers OK, or the reason it failed.
      failed_when: >-
        mysql_audit_filter_set.failed or
        mysql_audit_filter_set.query_result | flatten | map(attribute='result') | reject('equalto', 'OK') | list | length > 0


##################################################################
# Databases and users:
##################################################################

- name: Create the databases
  ansible.mysql.mysql_db:
    name: "{{ mysql_databases }}"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: "{{ mysql_socket }}"
  when: mysql_databases | length > 0

# Before the users: a migration user can log in as soon as it exists, and its migrations grant to the roles.
- name: Create the roles (their privileges come from the database migrations)
  ansible.mysql.mysql_role:
    name: "{{ item.name }}"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: "{{ mysql_socket }}"
  loop: "{{ mysql_roles }}"
  loop_control:
    label: "{{ item.name }}"

# Without a priv, a user's privileges are left alone: they come from its roles.
# The plugin is named because, given a plain password, ansible.mysql 5.x creates mysql_native_password accounts on
# servers before 9.7, and 8.4 has that plugin off. With a salt the module computes the caching_sha2_password hash
# itself, so the next run sees an unchanged password as unchanged. A salt needn't be secret, only differ per account.
- name: Create the users
  ansible.mysql.mysql_user:
    name: "{{ item.name }}"
    host: "{{ item.host }}"
    plugin: caching_sha2_password
    plugin_auth_string: "{{ item.password }}"
    salt: "{{ ((item.name ~ '@' ~ item.host) | hash('sha1'))[:20] }}"
    priv: "{{ item.priv | default(omit) }}"
    resource_limits: "{{ item.resource_limits | default(omit) }}"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: "{{ mysql_socket }}"
  loop: "{{ mysql_users }}"
  loop_control:
    label: "{{ item.name }}@{{ item.host }}"
  no_log: true

# set_default_role_all (the module's default): SET DEFAULT ROLE ALL TO each member, so the role is active at login.
- name: Make the users members of their roles
  ansible.mysql.mysql_role:
    name: "{{ item.name }}"
    members: "{{ item.members }}"
    state: present
    login_user: root
    login_password: "{{ mysql_root_password }}"
    login_unix_socket: "{{ mysql_socket }}"
  loop: "{{ mysql_roles | selectattr('members', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"


##################################################################
# Backups: the tools are installed; the backup disk and the S3 folder are ready for them
##################################################################

- name: Prepare the backup disk
  ansible.builtin.file:
    path: "{{ mysql_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Put the backup locations in every login shell ($BACKUP_DIR, $BACKUP_S3)
  ansible.builtin.template:
    src: lab-backup.sh.j2
    dest: /etc/profile.d/lab-backup.sh
    owner: root
    group: root
    mode: "0644"
