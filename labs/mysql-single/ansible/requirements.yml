---
# Collections used by this lab. Install / update them once (the full `ansible` package may bundle older ones):
#   ansible-galaxy collection install -r requirements.yml
# ansible.mysql replaces community.mysql, whose modules are deprecated from 5.0 and removed in 6.0.
collections:
  - name: ansible.posix
  - name: community.general
  - name: ansible.mysql
    version: ">=5.0.0"
  - name: community.docker # docker_compose_v2, for Prometheus and Grafana
    version: ">=3.6.0"
