---
# Lab: mysql-single. Run from this directory after `terraform apply`:
#   ansible-playbook site.yml
# Re-running it puts every server back into the known-good state.

- name: Wait for the servers (right after terraform apply they may still be booting)
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

# The two servers don't need each other for their own installation. With strategy "free" each one works
# through its own list without waiting for the other at every step; the `when` picks each server's roles
# by its group. On a new lab:
# - The PMM server starts at once. Only the MySQL server waits for the NAT gateway.
# - The sportsbook's migrations and data (Liquibase) start in the background on the PMM server and begin as
#   soon as MySQL accepts their login, while PMM is still being installed. The last play collects them.
- name: Set up the PMM server and the MySQL server, each at its own pace
  hosts: all
  become: true
  strategy: ansible.builtin.free
  pre_tasks:
    # A new NAT gateway can take a minute or two before the private subnets reach the internet. One
    # connection getting through does not mean it is stable yet, so the first downloads also try again.
    # The PMM server has a public address of its own and passes this at once.
    - name: Wait for internet access
      ansible.builtin.wait_for:
        host: dl.fedoraproject.org
        port: 443
        timeout: 300
  roles:
    - role: common
    - role: liquibase # before the PMM server: installs Liquibase and starts the update in the background
      when: "'pmm_server' in group_names"
      vars:
        liquibase_update_mode: background
    - role: pmm_server
      when: "'pmm_server' in group_names"
    - role: mysql_client # the mysql client on the PMM server, the application side
      when: "'pmm_server' in group_names"
    - role: data_volume # before MySQL is installed: its files go to the data disk; also mounts /backup
      when: "'mysql' in group_names"
    - role: mysql
      when: "'mysql' in group_names"

# From here on the steps need both servers: PMM must be running before a server registers with it,
# and the sportsbook's data must be there before the application starts.
- name: Register the MySQL server with PMM
  hosts: mysql
  become: true
  roles:
    - pmm_client

- name: Application side (runs on the PMM server)
  hosts: pmm_server
  become: true
  tasks:
    - name: Wait for the sportsbook's migrations and data, started in the background above
      ansible.builtin.import_role:
        name: liquibase
        tasks_from: finish.yml

    - name: Start the sportsbook application
      ansible.builtin.import_role:
        name: sportsbook
