# Ansible settings for this lab: run ansible-playbook from this directory.
[defaults]
inventory = inventory.ini
roles_path = roles:../../../ansible/roles
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10

[ssh_connection]
pipelining = True
# Reconnect when an SSH connection drops (the SSH config's keepalives detect dead connections).
retries = 3
