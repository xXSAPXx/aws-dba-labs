---
# The PMM server is also the application side and your admin seat: `mysql` connects to the MySQL server as dba
# without a prompt (~/.my.cnf). Name another server or user on the command line.
mysql_client_login:
  host: "{{ groups['mysql'][0] }}"
  user: dba
  password: "{{ mysql_dba_password }}"

# Liquibase: the sportsbook's migrations (schema/sportsbook in the repo), applied as sb_migrator.
# Liquibase ships no database drivers: MySQL Connector/J from Maven Central (checksum verified).
liquibase_jdbc_drivers:
  - file: mysql-connector-j-26.7.0.jar
    url: https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/26.7.0/mysql-connector-j-26.7.0.jar
    checksum: sha256:69084713593a4aa8d07c383619b9639276f08bccf8faf1c562178147d389b1e1
liquibase_projects:
  - name: sportsbook
    changelog_dir: "{{ playbook_dir }}/../../../schema/sportsbook"
    # program_name: the name MySQL keeps for Liquibase's sessions (performance_schema.session_connect_attrs).
    url: "jdbc:mysql://{{ groups['mysql'][0] }}:3306/sportsbook?connectionAttributes=program_name:liquibase"
    username: sb_migrator
    password: "{{ mysql_sb_migrator_password }}"
    liquibase_schema: sportsbook # where DATABASECHANGELOG lives: in MySQL, the database
    parameters:
      sportsbook_scale: "{{ sportsbook_scale }}"

# The sportsbook application: one user per part, each a member of its role.
sportsbook_db:
  app: { host: "{{ groups['mysql'][0] }}", user: sb_app, password: "{{ mysql_sb_app_password }}", database: sportsbook }
  feed: { host: "{{ groups['mysql'][0] }}", user: sb_feed, password: "{{ mysql_sb_feed_password }}", database: sportsbook }
  batch: { host: "{{ groups['mysql'][0] }}", user: sb_batch, password: "{{ mysql_sb_batch_password }}", database: sportsbook }
  reporting: { host: "{{ groups['mysql'][0] }}", user: sb_reporting, password: "{{ mysql_sb_reporting_password }}", database: sportsbook }
  support: { host: "{{ groups['mysql'][0] }}", user: sb_support, password: "{{ mysql_sb_support_password }}", database: sportsbook }
sportsbook_pmm_password: "{{ pmm_admin_password }}"

# Prometheus and Grafana next to PMM: Prometheus finds this lab's servers by their Lab tag.
prometheus_grafana_ec2_lab: mysql-single
prometheus_grafana_admin_password: "{{ grafana_admin_password }}"
# node_exporter runs on the MySQL servers (site.yml), not on this one.
prometheus_grafana_node_exporter: true
prometheus_grafana_node_exporter_skip: "{{ groups['pmm_server'] }}" # the inventory names are the EC2 Name tags

# sysbench, on demand (sysbench.yml): rate, size and test are the sysbench role's defaults.
sysbench_mysql_host: "{{ groups['mysql'][0] }}"
sysbench_mysql_password: "{{ mysql_sbtest_password }}"
